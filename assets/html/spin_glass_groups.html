<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Spin-Glass Group Formation</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#0d0d1a; width:100vw; height:100vh; overflow:hidden;
       font-family:'Segoe UI',Arial,sans-serif; }
canvas { display:block; }

/* ── Controls panel ────────────────────────────── */
#ctrl {
  position:absolute; bottom:18px; left:50%; transform:translateX(-50%);
  display:flex; gap:18px; align-items:center;
  background:rgba(13,13,26,0.72); border:1px solid rgba(255,255,255,0.09);
  border-radius:22px; padding:8px 20px;
  backdrop-filter:blur(6px);
}
.ctrl-group {
  display:flex; flex-direction:column; align-items:center; gap:3px;
}
.ctrl-label {
  color:rgba(255,255,255,0.45); font-size:10px; letter-spacing:0.07em;
  font-family:monospace; white-space:nowrap;
}
.ctrl-val {
  color:rgba(255,255,255,0.75); font-size:11px; font-family:monospace;
  min-width:2.5em; text-align:center;
}
input[type=range] {
  -webkit-appearance:none; width:120px; height:4px;
  background:rgba(255,255,255,0.12); border-radius:2px; outline:none;
  cursor:pointer;
}
input[type=range]::-webkit-slider-thumb {
  -webkit-appearance:none; width:13px; height:13px; border-radius:50%;
  background:#7cd4ff; cursor:pointer; box-shadow:0 0 6px rgba(91,200,245,0.6);
}
#sTemp { width:100px; }

.ctrl-sep { width:1px; height:32px; background:rgba(255,255,255,0.10); }

button {
  background:rgba(255,255,255,0.07); border:1px solid rgba(255,255,255,0.15);
  color:rgba(255,255,255,0.55); padding:5px 13px; border-radius:14px;
  cursor:pointer; font-size:10px; letter-spacing:0.05em; transition:all .2s;
}
button:hover { background:rgba(255,255,255,0.13); color:rgba(255,255,255,0.85); }
button:active { background:rgba(255,255,255,0.18); }

select {
  background:rgba(255,255,255,0.07); border:1px solid rgba(255,255,255,0.15);
  color:rgba(255,255,255,0.65); padding:4px 8px; border-radius:10px;
  cursor:pointer; font-size:10px; letter-spacing:0.05em;
  outline:none; appearance:none; -webkit-appearance:none;
  text-align:center;
}
select:hover { background:rgba(255,255,255,0.13); }

/* ── Title ─────────────────────────────────────── */
#lbl {
  position:absolute; top:12px; left:50%; transform:translateX(-50%);
  pointer-events:none; text-align:center;
}
#lbl .lbl-title {
  color:rgba(255,255,255,0.70); font-size:14px; letter-spacing:0.06em;
  font-weight:600;
}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="lbl">
  <div class="lbl-title">Homophily-Based Social Group Formation</div>
</div>

<div id="ctrl">
  <!-- N slider -->
  <div class="ctrl-group">
    <span class="ctrl-label">AGENTS</span>
    <input type="range" id="sN" min="4" max="25" step="1" value="20">
    <span class="ctrl-val" id="vN">20</span>
  </div>

  <div class="ctrl-sep"></div>

  <!-- Temperature slider -->
  <div class="ctrl-group">
    <span class="ctrl-label">TEMPERATURE</span>
    <input type="range" id="sTemp" min="0" max="100" step="1" value="100">
    <span class="ctrl-val" id="vT">high</span>
  </div>

  <!-- Initial conditions dropdown -->
  <div class="ctrl-group">
    <span class="ctrl-label">INITIAL STATE</span>
    <select id="selInit" onchange="initSim()">
      <option value="random">random singletons</option>
      <option value="ordered">all ↑ singletons</option>
      <option value="split">± split singletons</option>
      <option value="one_group">one group (random)</option>
      <option value="one_group_up">one group (all ↑)</option>
      <option value="two_groups">two groups (±)</option>
    </select>
  </div>

  <!-- Reset -->
  <button onclick="initSim()">reset</button>
</div>

<script>
// ═══════════════════════════════════════════════════════
//  PARAMETERS
// ═══════════════════════════════════════════════════════
let N  = 20;
const AR     = 7;
const J      = 1.0;

const T_LOW  = 0.10;
const T_HIGH = 5.00;   // T_c ≈ J·(k−1); for k~5 that's ~4, so range up to 5
const T_RATE = 0.0025;

// Ring layout
const RING_R   = [0,  18,  36,  54,  72];
const RING_CAP = [1,   6,  12,  18,  24];

// Group physics
const SOCIAL_R    = 380;
const SOCIAL_STR  = 0.18;
const HARD_STR    = 1.2;
const WALL_PAD    = 72;
const DAMPING     = 0.80;
const MASS_SCALE  = 0.55;

// Colours
const CUP    = { r:91,  g:200, b:245 };
const CDOWN  = { r:232, g:64,  b:64  };
const CFLASH = { r:255, g:255, b:200 };

// ═══════════════════════════════════════════════════════
//  CANVAS
// ═══════════════════════════════════════════════════════
const canvas = document.getElementById('c');
const ctx    = canvas.getContext('2d');
let W, H;
function resizeCanvas() { W = canvas.width = innerWidth; H = canvas.height = innerHeight; }
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

// ═══════════════════════════════════════════════════════
//  STATE
// ═══════════════════════════════════════════════════════
let agents = [];
let gMap   = {};
let gSeq   = 0;

let T = T_HIGH;

let flying = [];

// ── Slider wiring ──────────────────────────────────────
const sN    = document.getElementById('sN');
const sTemp = document.getElementById('sTemp');
const vN    = document.getElementById('vN');
const vT    = document.getElementById('vT');

sN.addEventListener('input', () => { vN.textContent = sN.value; });
sN.addEventListener('change', () => { N = parseInt(sN.value); initSim(); });

sTemp.addEventListener('input', () => {
  T = T_LOW + (sTemp.value / 100) * (T_HIGH - T_LOW);
  updateTLabel();
});

function updateTLabel() {
  const frac = (T - T_LOW) / (T_HIGH - T_LOW);
  vT.textContent = frac < 0.25 ? 'low' : frac < 0.6 ? 'mid' : 'high';
}

// ═══════════════════════════════════════════════════════
//  GROUP HELPERS
// ═══════════════════════════════════════════════════════
function mkGroup(x, y) {
  const id = gSeq++;
  gMap[id] = { id, x, y, vx:0, vy:0, members:new Set(), mag:0, dispR:0 };
  return id;
}
function destroyGroup(gid) { delete gMap[gid]; }

function recomputeMag(gid) {
  const g = gMap[gid]; if (!g) return;
  if (g.members.size === 0) { g.mag = 0; return; }
  let s = 0;
  for (const i of g.members) s += agents[i].op;
  g.mag = s / g.members.size;
}

function targetR(sz) {
  if (sz <= 0) return 0;
  let rem = sz, ring = 0;
  for (let i = 0; i < RING_CAP.length; i++) {
    if (rem <= RING_CAP[i]) { ring = i; break; }
    rem -= RING_CAP[i]; ring = i + 1;
  }
  ring = Math.min(ring, RING_R.length - 1);
  return RING_R[ring] + AR + 13;
}

// ═══════════════════════════════════════════════════════
//  INIT
// ═══════════════════════════════════════════════════════
function initSim() {
  agents = []; gMap = {}; gSeq = 0; flying = [];
  // T stays wherever the slider is — don't reset it

  const mode = document.getElementById('selInit').value;

  if (mode === 'one_group' || mode === 'one_group_up') {
    const gid = mkGroup(W / 2, H / 2);
    for (let i = 0; i < N; i++) {
      const op = mode === 'one_group_up' ? 1 : (Math.random() < 0.5 ? 1 : -1);
      agents.push({ id: i, op, gid, flashTimer: 0 });
      gMap[gid].members.add(i);
    }
    recomputeMag(gid);
    gMap[gid].dispR = targetR(N);
    return;
  }

  if (mode === 'two_groups') {
    // Two pre-formed clusters: left half all +1, right half all −1
    const nA = Math.floor(N / 2), nB = N - nA;
    const gA = mkGroup(W * 0.35, H / 2);
    const gB = mkGroup(W * 0.65, H / 2);
    for (let i = 0; i < N; i++) {
      const inA = i < nA;
      const op  = inA ? 1 : -1;
      const gid = inA ? gA : gB;
      agents.push({ id: i, op, gid, flashTimer: 0 });
      gMap[gid].members.add(i);
    }
    recomputeMag(gA); gMap[gA].dispR = targetR(nA);
    recomputeMag(gB); gMap[gB].dispR = targetR(nB);
    return;
  }

  // Singleton layouts (random, ordered, split)
  // Start in a compact cluster near the centre so group formation
  // is immediately visible rather than agents miles apart.
  const spread = Math.min(W, H) * 0.22;   // radius of initial scatter
  const cols = Math.round(Math.sqrt(N));
  const rows = Math.ceil(N / cols);
  const step = spread * 2 / Math.max(cols, rows);
  const ox   = W / 2 - step * (cols - 1) / 2;
  const oy   = H / 2 - step * (rows - 1) / 2;

  for (let i = 0; i < N; i++) {
    let op;
    if      (mode === 'ordered') op = 1;
    else if (mode === 'split')   op = i < Math.floor(N / 2) ? 1 : -1;
    else                         op = Math.random() < 0.5 ? 1 : -1;
    const col = i % cols;
    const row = Math.floor(i / cols);
    const x   = ox + col * step + (Math.random() - 0.5) * step * 0.6;
    const y   = oy + row * step + (Math.random() - 0.5) * step * 0.6;
    const gid = mkGroup(Math.max(50, Math.min(W-50, x)), Math.max(50, Math.min(H-50, y)));
    agents.push({ id: i, op, gid, flashTimer: 0 });
    gMap[gid].members.add(i);
    recomputeMag(gid);
    gMap[gid].dispR = targetR(1);
  }
}

// ═══════════════════════════════════════════════════════
//  MC STEP
//
//  Hamiltonian (φ=1, fully connected, paper eq.):
//    H_k = −(J/2) Σ_{i≠j ∈ g} s_i s_j
//
//  Energy of agent a in group g (k members):
//    E_a = −J · s_a · Σ_{j≠a} s_j = −J · s_a · (k−1) · m_excl
//
//  Spin flip ΔE:
//    ΔE = 2·J·s_a·(k−1)·m_excl
//
//  Group move ΔE (leave g of size k_g, join tg of size k_tg):
//    ΔE = −J·s_a·k_tg·m_tg  −  (−J·s_a·(k_g−1)·m_excl_g)
//       = J·s_a·[(k_g−1)·m_excl_g − k_tg·m_tg]
//
//  Note: T_c = J·(k−1) for a group of size k, so the phase
//  transition temperature grows with group size — large aligned
//  clusters become self-stabilising, which is the key result.
//
//  Metropolis acceptance: min(1, exp(−ΔE/T))
// ═══════════════════════════════════════════════════════
function mcStep() {
  const a = agents[Math.floor(Math.random() * N)];
  const g = gMap[a.gid];
  if (!g) return;

  if (Math.random() < 0.5) {
    // ── Spin flip ──────────────────────────────────
    // E_a = −J·s_a·(k−1)·m_excl  →  ΔE = 2J·s_a·(k−1)·m_excl
    let mExcl = 0;
    const kOthers = g.members.size - 1;
    if (kOthers > 0) {
      mExcl = (g.mag * g.members.size - a.op) / kOthers;
    }
    const dE = 2 * J * a.op * kOthers * mExcl;

    if (dE < 0 || Math.random() < Math.exp(-dE / Math.max(T, 0.005))) {
      a.op *= -1;
      if (g.members.size > 1) a.flashTimer = 18;
      recomputeMag(a.gid);
    }
    return;
  }

  // ── Group change ────────────────────────────────
  const liveGids = Object.keys(gMap).map(Number)
                         .filter(id => gMap[id]?.members.size > 0);
  const others   = liveGids.filter(id => id !== a.gid);

  const pNew = Math.max(0.05, 1 / (others.length + 1));
  let tgid; let isNew = false;

  if (Math.random() < pNew || others.length === 0) {
    const angle = Math.random() * Math.PI * 2;
    const dist  = g.dispR + targetR(1) + 20 + Math.random() * 40;
    tgid = mkGroup(
      Math.max(50, Math.min(W - 50, g.x + Math.cos(angle) * dist)),
      Math.max(50, Math.min(H - 50, g.y + Math.sin(angle) * dist))
    );
    isNew = true;
  } else {
    tgid = others[Math.floor(Math.random() * others.length)];
  }

  const tg = gMap[tgid]; if (!tg) return;

  // ΔE = −J·s_a·k_tg·m_tg  −  (−J·s_a·(k_g−1)·m_excl_g)
  const kG  = g.members.size - 1;            // bonds lost on leaving g
  const kTg = tg.members.size;               // bonds gained on joining tg
  let mExclG = 0;
  if (kG > 0) mExclG = (g.mag * g.members.size - a.op) / kG;
  const mTg = tg.members.size > 0 ? tg.mag : 0;
  const dE  = J * a.op * (kG * mExclG - kTg * mTg);

  if (dE < 0 || Math.random() < Math.exp(-dE / Math.max(T, 0.005))) {
    const fromPos = agentPos(a.id);

    g.members.delete(a.id);
    recomputeMag(a.gid);
    const gDied = g.members.size === 0;

    a.gid = tgid;
    tg.members.add(a.id);
    recomputeMag(tgid);

    if (gDied) destroyGroup(g.id);

    flying.push({ aid: a.id, x0: fromPos.x, y0: fromPos.y, tgid, prog: 0, dur: 38 });
  } else {
    if (isNew && tg.members.size === 0) destroyGroup(tgid);
  }
}

// ═══════════════════════════════════════════════════════
//  GROUP PHYSICS
// ═══════════════════════════════════════════════════════
function updateGroupPositions() {
  const active = Object.values(gMap).filter(g => g.members.size > 0);

  for (const g of active) {
    let fx = 0, fy = 0;
    const mass = g.members.size * MASS_SCALE + 1;

    for (const h of active) {
      if (h.id === g.id) continue;
      const dx = g.x - h.x, dy = g.y - h.y;
      const d  = Math.sqrt(dx*dx + dy*dy) + 0.001;
      const nx = dx / d, ny = dy / d;

      const minDist = g.dispR + h.dispR + 12;
      if (d < minDist) {
        const push = HARD_STR * (minDist - d) / minDist;
        fx += push * nx; fy += push * ny;
      }

      if (d < SOCIAL_R && d > minDist * 0.9) {
        const J_eff = g.mag * h.mag;
        const fall  = 1 - d / SOCIAL_R;
        const str   = J_eff * SOCIAL_STR * fall;
        fx -= str * nx; fy -= str * ny;
      }
    }

    const pad = WALL_PAD + g.dispR;
    if (g.x < pad)   fx += 0.5 * (pad - g.x) / pad;
    if (g.x > W-pad) fx -= 0.5 * (g.x - (W-pad)) / pad;
    if (g.y < pad)   fy += 0.5 * (pad - g.y) / pad;
    if (g.y > H-pad) fy -= 0.5 * (g.y - (H-pad)) / pad;

    fx += (W/2 - g.x) * 0.006;
    fy += (H/2 - g.y) * 0.006;

    g.vx = (g.vx + fx / mass) * DAMPING;
    g.vy = (g.vy + fy / mass) * DAMPING;
    g.x += g.vx; g.y += g.vy;
    g.dispR += (targetR(g.members.size) - g.dispR) * 0.09;
  }
}

// ═══════════════════════════════════════════════════════
//  AGENT POSITION  (concentric rings)
// ═══════════════════════════════════════════════════════
function agentPos(aid) {
  const a = agents[aid]; if (!a) return { x: W/2, y: H/2 };
  const g = gMap[a.gid]; if (!g) return { x: W/2, y: H/2 };

  const members = [...g.members].sort((x, y) => x - y);
  const idx     = members.indexOf(aid);
  if (idx === -1) return { x: g.x, y: g.y };

  let cum = 0;
  for (let ri = 0; ri < RING_CAP.length; ri++) {
    if (idx < cum + RING_CAP[ri]) {
      if (ri === 0) return { x: g.x, y: g.y };
      const posInRing = idx - cum;
      const angle     = (posInRing / RING_CAP[ri]) * Math.PI * 2 - Math.PI / 2;
      return { x: g.x + RING_R[ri] * Math.cos(angle), y: g.y + RING_R[ri] * Math.sin(angle) };
    }
    cum += RING_CAP[ri];
  }
  return { x: g.x, y: g.y };
}

// ═══════════════════════════════════════════════════════
//  COLOUR HELPERS
// ═══════════════════════════════════════════════════════
function lerpC(a, b, t) {
  return { r: Math.round(a.r+(b.r-a.r)*t), g: Math.round(a.g+(b.g-a.g)*t), b: Math.round(a.b+(b.b-a.b)*t) };
}
function rgba(c, a) { return `rgba(${c.r},${c.g},${c.b},${a})`; }
function magCol(m)   { return lerpC(CDOWN, CUP, (m + 1) / 2); }
function spinCol(op) { return op > 0 ? CUP : CDOWN; }

// ═══════════════════════════════════════════════════════
//  ARROW GLYPH
// ═══════════════════════════════════════════════════════
function drawArrow(ctx, up, col, r) {
  const ht=r*.88, hw=r*.45, sw=r*.19, hh=r*.36;
  ctx.fillStyle = rgba(col, 1);
  ctx.beginPath();
  if (up) {
    const ty=-ht*.5, sy=ty+hh, by=ht*.42;
    ctx.moveTo(0,ty); ctx.lineTo(hw,sy); ctx.lineTo(sw,sy);
    ctx.lineTo(sw,by); ctx.lineTo(-sw,by); ctx.lineTo(-sw,sy); ctx.lineTo(-hw,sy);
  } else {
    const ty=ht*.5, sy=ty-hh, by=-ht*.42;
    ctx.moveTo(0,ty); ctx.lineTo(hw,sy); ctx.lineTo(sw,sy);
    ctx.lineTo(sw,by); ctx.lineTo(-sw,by); ctx.lineTo(-sw,sy); ctx.lineTo(-hw,sy);
  }
  ctx.closePath(); ctx.fill();
}

// ═══════════════════════════════════════════════════════
//  INTER-GROUP FORCE LINES
// ═══════════════════════════════════════════════════════
function drawGroupForces(active) {
  for (let i = 0; i < active.length; i++) {
    for (let j = i + 1; j < active.length; j++) {
      const a = active[i], b = active[j];
      const dx = b.x - a.x, dy = b.y - a.y;
      const d  = Math.sqrt(dx*dx + dy*dy);
      if (d > SOCIAL_R) continue;
      const J_eff = a.mag * b.mag;
      if (Math.abs(J_eff) < 0.05) continue;
      const alpha = Math.abs(J_eff) * (1 - d / SOCIAL_R) * 0.18;
      const col   = J_eff > 0 ? CUP : CDOWN;
      const minD  = a.dispR + b.dispR + 12;
      if (d < minD + 10) continue;
      ctx.save();
      ctx.setLineDash([4, 6]);
      ctx.strokeStyle = rgba(col, alpha);
      ctx.lineWidth   = 1;
      ctx.beginPath();
      const ux = dx/d, uy = dy/d;
      ctx.moveTo(a.x + ux*a.dispR, a.y + uy*a.dispR);
      ctx.lineTo(b.x - ux*b.dispR, b.y - uy*b.dispR);
      ctx.stroke();
      ctx.setLineDash([]);
      ctx.restore();
    }
  }
}

// ═══════════════════════════════════════════════════════
//  RENDER
// ═══════════════════════════════════════════════════════
function drawScene() {
  ctx.fillStyle = 'rgba(13,13,26,0.30)';
  ctx.fillRect(0, 0, W, H);

  const inFlight = new Set(flying.filter(f => f.prog < f.dur).map(f => f.aid));
  const active   = Object.values(gMap).filter(g => g.members.size > 0);

  drawGroupForces(active);

  for (const g of active) {
    const col = magCol(g.mag);
    const r   = g.dispR;
    if (r < 1) continue;

    ctx.save();
    ctx.shadowBlur = 28; ctx.shadowColor = rgba(col, 0.28);
    ctx.beginPath(); ctx.arc(g.x, g.y, r, 0, Math.PI*2);
    ctx.fillStyle = rgba(col, 0.08); ctx.fill();
    ctx.strokeStyle = rgba(col, 0.46); ctx.lineWidth = 1.8; ctx.stroke();
    ctx.restore();

    if (g.members.size >= 2) {
      ctx.save();
      ctx.globalAlpha = 0.30;
      ctx.fillStyle   = rgba(col, 1);
      ctx.font        = 'bold 11px monospace';
      ctx.textAlign   = 'center';
      ctx.fillText(`k=${g.members.size}`, g.x, g.y + r + 13);
      ctx.restore();
    }

    if (g.members.size >= 2 && g.members.size <= 7) {
      const ms = [...g.members];
      ctx.save();
      ctx.strokeStyle = rgba(col, 0.11); ctx.lineWidth = 0.8;
      for (let i = 0; i < ms.length; i++) {
        for (let j = i+1; j < ms.length; j++) {
          if (inFlight.has(ms[i]) || inFlight.has(ms[j])) continue;
          const pi = agentPos(ms[i]), pj = agentPos(ms[j]);
          ctx.beginPath(); ctx.moveTo(pi.x,pi.y); ctx.lineTo(pj.x,pj.y); ctx.stroke();
        }
      }
      ctx.restore();
    }
  }

  for (let i = 0; i < N; i++) {
    if (inFlight.has(i)) continue;
    const a = agents[i];
    if (!gMap[a.gid]) continue;
    const pos = agentPos(i);
    const col = spinCol(a.op);

    let flashAlpha = 0;
    if (a.flashTimer > 0) { flashAlpha = a.flashTimer / 18; a.flashTimer--; }

    ctx.save();
    ctx.translate(pos.x, pos.y);

    if (flashAlpha > 0) {
      const fc = lerpC(col, CFLASH, flashAlpha);
      ctx.shadowBlur = 22 * flashAlpha; ctx.shadowColor = rgba(fc, flashAlpha);
      ctx.beginPath(); ctx.arc(0, 0, AR*(1+0.55*flashAlpha), 0, Math.PI*2);
      ctx.strokeStyle = rgba(fc, flashAlpha*0.85); ctx.lineWidth = 2.5; ctx.stroke();
    }

    ctx.shadowBlur = 9; ctx.shadowColor = rgba(col, 0.7);
    ctx.beginPath(); ctx.arc(0, 0, AR, 0, Math.PI*2);
    ctx.fillStyle = rgba(col, 0.18); ctx.fill();
    ctx.strokeStyle = rgba(col, 0.6); ctx.lineWidth = 1.3; ctx.stroke();
    ctx.shadowBlur = 0;
    drawArrow(ctx, a.op > 0, col, AR);
    ctx.restore();
  }

  flying = flying.filter(f => f.prog <= f.dur);
  for (const f of flying) {
    f.prog++;
    const t  = f.prog / f.dur;
    const et = t < 0.5 ? 2*t*t : -1 + (4-2*t)*t;
    const tg = gMap[f.tgid]; if (!tg) continue;
    const dist    = Math.hypot(tg.x - f.x0, tg.y - f.y0);
    const liftMag = Math.min(dist * 0.38, 80);
    const px = f.x0 + (tg.x - f.x0) * et;
    const py = f.y0 + (tg.y - f.y0) * et - Math.sin(t * Math.PI) * liftMag;
    const a     = agents[f.aid];
    const col   = a ? spinCol(a.op) : CUP;
    const alpha = Math.sin(t * Math.PI) * 0.85 + 0.15;

    ctx.save();
    ctx.globalAlpha = alpha; ctx.translate(px, py);
    ctx.shadowBlur = 14; ctx.shadowColor = rgba(col, 0.9);
    ctx.beginPath(); ctx.arc(0, 0, AR, 0, Math.PI*2);
    ctx.fillStyle = rgba(col, 0.28); ctx.fill();
    ctx.shadowBlur = 0;
    if (a) drawArrow(ctx, a.op > 0, col, AR);
    ctx.restore();
  }

  drawHUD();
}

// ═══════════════════════════════════════════════════════
//  HUD  (top-right stats)
// ═══════════════════════════════════════════════════════
function rrect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.lineTo(x+w-r,y); ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r); ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  ctx.lineTo(x+r,y+h); ctx.quadraticCurveTo(x,y+h,x,y+h-r);
  ctx.lineTo(x,y+r); ctx.quadraticCurveTo(x,y,x+r,y); ctx.closePath();
}

function drawHUD() {
  const nUp  = agents.filter(a => a.op > 0).length;
  const nDn  = N - nUp;
  const m    = (nUp - nDn) / N;   // global magnetisation ∈ [−1, 1]
  const ids  = Object.keys(gMap).map(Number).filter(id => gMap[id]?.members.size > 0);
  const nG   = ids.length;
  const bigK = nG ? Math.max(...ids.map(id => gMap[id].members.size)) : 0;

  // Fixed right edge for all text
  const rx = W - 16;

  ctx.save();
  ctx.textAlign = 'right'; ctx.globalAlpha = 0.50;
  ctx.font = '13px sans-serif'; ctx.fillStyle = 'rgba(255,255,255,0.45)';
  ctx.fillText(`groups: ${nG}`,      rx, H - 72);
  ctx.fillText(`largest  k=${bigK}`, rx, H - 54);
  ctx.fillText(`T = ${T.toFixed(2)}`,rx, H - 36);

  // Magnetisation label: "m=" is fixed-position; value is zero-padded
  // Always format as sign + "x.xx" so total chars after "m=" is always 5:
  //   " 1.00"  " 0.50"  "-1.00"
  const mAbs = Math.abs(m).toFixed(2);               // "1.00", "0.50" …
  const mSign = m < 0 ? '−' : ' ';              // minus or thin-space
  const mStr  = `m= ${mSign}${mAbs}`;                // fixed visual width

  // Draw "m=" and value as two separate calls anchored from the right,
  // so the "m=" label never shifts regardless of sign or magnitude.
  ctx.font = '13px monospace'; ctx.globalAlpha = 0.50;
  ctx.fillStyle = 'rgba(255,255,255,0.45)';
  ctx.fillText('m=', rx - 52, H - 18);   // "m=" anchored 52px from right
  const mCol = magCol(m);
  ctx.fillStyle = rgba(mCol, 0.85);
  ctx.fillText(`${mSign}${mAbs}`, rx, H - 18);   // value right-aligned

  // Magnetisation bar (−1 … +1)
  const barW = 100, barH = 5, bx = rx - barW, by = H - 8;
  ctx.globalAlpha = 0.18;
  ctx.fillStyle = 'rgba(255,255,255,1)';
  rrect(ctx, bx, by, barW, barH, 3); ctx.fill();
  ctx.globalAlpha = 0.60;
  const mFrac = (m + 1) / 2;
  const fillW = Math.max(3, barW * mFrac);
  ctx.fillStyle = rgba(mCol, 1);
  rrect(ctx, bx, by, fillW, barH, 3); ctx.fill();

  // Spin counts (top-right)
  ctx.font = 'bold 16px sans-serif'; ctx.globalAlpha = 0.80;
  ctx.fillStyle = rgba(CUP,  0.90); ctx.fillText(`↑ ${nUp}`, rx, 30);
  ctx.fillStyle = rgba(CDOWN,0.90); ctx.fillText(`↓ ${nDn}`, rx, 50);
  ctx.restore();
}

// ═══════════════════════════════════════════════════════
//  MAIN LOOP  — 3 MC steps per frame keeps the animation
//  readable; N steps/frame was too fast to follow visually.
// ═══════════════════════════════════════════════════════
const STEPS_PER_FRAME = 3;

function loop() {
  requestAnimationFrame(loop);
  for (let i = 0; i < STEPS_PER_FRAME; i++) mcStep();
  updateGroupPositions();
  drawScene();
}

initSim();
loop();
</script>
</body>
</html>
