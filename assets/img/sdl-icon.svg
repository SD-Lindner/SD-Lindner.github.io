<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <style>
    .bg        { fill: #6117A0; }
    .light-txt { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 62px; letter-spacing: -1px; font-weight: 300; fill: #ffffff; }
    .bold-txt  { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 62px; letter-spacing: -1px; font-weight: 800; fill: #ffffff; }
    @media (prefers-color-scheme: dark) {
      .bg        { fill: #3D0D68; }
      .light-txt { fill: #B480E8; }
      .bold-txt  { fill: #B480E8; }
    }
  </style>
  <!-- rect bleeds 2px past the viewBox on all sides so rounded corners never leave a gap -->
  <rect class="bg" x="-2" y="-2" width="104" height="104" rx="20"/>
  <text x="50" y="72" text-anchor="middle">
    <tspan class="light-txt">sd</tspan><tspan class="bold-txt">L</tspan>
  </text>
</svg>
